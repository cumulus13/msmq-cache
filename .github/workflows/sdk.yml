name: sdk
# Runs every SDK against the shared fake server (sdk/conformance). The python SDK has its own workflow.
on:
  push: { paths: ['sdk/**', '.github/workflows/sdk.yml'] }
  pull_request: { paths: ['sdk/**'] }
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd sdk/node && npm install
      - run: cd sdk/node && ../conformance/run.sh npm test
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: cd sdk/go && go vet ./... && ../conformance/run.sh go test -count=1 ./...
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd sdk/rust && ../conformance/run.sh cargo test
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: cd sdk/java && ./run-tests.sh
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - run: cd sdk/php && ../conformance/run.sh php tests/conformance.php
  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - run: cd sdk/ruby && ../conformance/run.sh ruby -Ilib test/conformance_test.rb
