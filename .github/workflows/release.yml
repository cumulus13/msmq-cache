name: release
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - run: dotnet test tests/MsmqCache.Tests -c Release
      - name: Build server and COM component
        shell: pwsh
        run: |
          dotnet build src/MsmqCache.Server -c Release -o stage/server
          dotnet build src/MsmqCache.Com -c Release -o stage/com
          Copy-Item conf/mcache.conf stage/server/ -Force
          Compress-Archive -Path stage/server/*, stage/com -DestinationPath mcache-server-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: server, path: mcache-server-windows.zip }
  cli:
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: macos-latest,   rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - run: dotnet publish src/MsmqCache.Cli -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with: { name: 'cli-${{ matrix.rid }}', path: out/mcache-cli* }
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pandoc texlive-xetex texlive-latex-recommended lmodern librsvg2-bin
      - run: npm install -g mermaid-filter
      - name: Allow Chromium (puppeteer) sandbox on Ubuntu 24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bash docs/build-docs.sh
      - uses: actions/upload-artifact@v4
        with: { name: docs, path: dist/docs }
  publish:
    needs: [server, cli, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/server/*
            artifacts/cli-*/*
            artifacts/docs/*
