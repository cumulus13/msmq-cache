# mcache.conf - MSMQ-backed cache server. Syntax: "directive value" (quotes allowed), '#' starts a comment.

# ---- TCP ingress (any client OS) ----
tcp-enabled yes
bind 127.0.0.1
port 6390
# requirepass change-me
maxclients 1000
command-timeout-ms 5000

# ---- MSMQ backend ----
# Queues created: private$\<prefix>.ingress  .data  .reply.tcp  .reply.com  .q.<name>
queue-prefix mcache
# yes = MSMQ "recoverable" delivery (disk backed, survives reboot) for commands and work-queue messages
recoverable yes
# MSMQ TimeToBeReceived for commands nobody consumed / replies nobody collected (seconds)
request-ttl 60
reply-ttl 30
# 0 = MSMQ default queue quota; otherwise KB (a full queue makes writes fail with an MSMQ error; there is no eviction)
max-queue-kb 0
# MSMQ hard limit is 4 MB per message including properties
max-value-bytes 4000000
sweep-interval 30

# ---- COM / remote MSMQ senders ----
# Accounts allowed to Send to the ingress queue (needed for COM clients on other accounts or machines)
# ingress-send-account "DOMAIN\cache-clients"

# ---- logging ----
loglevel info
# logfile C:\ProgramData\mcache\mcache.log
